# Hourly scheduler tick for the collection fleet.
#
# This lives here rather than in `vercel.json` because Vercel's Hobby plan
# rejects any cron expression that runs more than once a day, which fails the
# whole deployment. The tick itself is unchanged: it is still hourly, and which
# sources actually run is still decided per source from its configured cadence
# (6h pricing, 12h lifecycle and catalog) inside /api/cron/collect.
name: collect

on:
  schedule:
    # Hourly. Must match SCHEDULER_TICK in lib/orchestration/schedule.ts.
    - cron: "0 * * * *"
  workflow_dispatch:

# A slow fleet run must never overlap the next tick.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the collection fleet
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${PRODUCTION_URL:-}" ]; then
            echo "CRON_SECRET secret and PRODUCTION_URL variable must both be configured." >&2
            exit 1
          fi
          code=$(curl -sS --max-time 300 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_URL}/api/cron/collect")
          echo "HTTP ${code}"
          # Truncated: the fleet summary is safe to log, secrets are never echoed.
          head -c 2000 response.json || true
          echo
          if [ "${code}" != "200" ]; then
            echo "Scheduler tick failed with HTTP ${code}" >&2
            exit 1
          fi
